<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saver Business Card</title>
<style>
  @font-face { font-family: "Cairo"; src: url("cairo-arabic.woff2") format("woff2"); font-weight: 200 1000; unicode-range: U+0600-06FF, U+0750-077F, U+FB50-FDFF, U+FE70-FEFF; }
  @font-face { font-family: "Lobster"; src: url("lobster.woff2") format("woff2"); }
  @font-face { font-family: "Cairo"; src: url("cairo-latin.woff2") format("woff2"); font-weight: 200 1000; }

  :root {
    --blue: #2F6EB5;
    --deep: #1F4E86;
    --mist: #C9D9EC;
    --grey: #6B7280;
    --paper: #FFFFFF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #eef2f7; font-family: "Cairo", sans-serif; padding: 24px; display: flex; flex-direction: column; gap: 24px; align-items: center; }

  /* 90×55 mm trim + 3 mm bleed on each side = 96×61 mm */
  .card { position: relative; width: 96mm; height: 61mm; background: var(--paper); overflow: hidden; box-shadow: 0 4px 18px rgba(31,78,134,.15); }
  .safe { position: absolute; inset: 6mm; } /* 3 mm bleed + 3 mm safe margin */

  /* faint ceramide ring motif */
  .rings { position: absolute; }

  /* ---------- FRONT ---------- */
  .front .bottle { position: absolute; left: 4mm; bottom: 3mm; height: 57mm; }
  .front .text { position: absolute; right: 7mm; top: 0; bottom: 0; width: 50mm; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
  .wordmark { font-family: "Lobster", "Brush Script MT", cursive; color: var(--blue); font-size: 38pt; line-height: 1; }
  .wordmark small { font-size: 13pt; color: var(--deep); font-family: "Cairo", sans-serif; font-weight: 600; letter-spacing: 2pt; display: block; margin-top: 1mm; }
  .divider { width: 22mm; height: .5mm; background: var(--blue); border-radius: 1mm; margin: 3.2mm auto 2.6mm; }
  .slogan-ar { direction: rtl; font-weight: 800; color: var(--deep); font-size: 21pt; line-height: 1.25; }
  .slogan-en { font-weight: 400; color: var(--grey); font-size: 9pt; letter-spacing: 1.6pt; text-transform: uppercase; margin-top: .6mm; }
  .band-bottom { position: absolute; left: 0; right: 0; bottom: 0; height: 5mm; background: var(--blue); }

  /* ---------- BACK ---------- */
  .back .band { position: absolute; top: 0; bottom: 0; right: 0; width: 17mm; background: var(--blue); display: flex; align-items: center; justify-content: center; }
  .back .band span { writing-mode: vertical-rl; transform: rotate(180deg); color: #fff; font-weight: 800; font-size: 17pt; letter-spacing: 1.5pt; }
  .back .info { position: absolute; left: 7mm; top: 6mm; bottom: 6mm; right: 22mm; display: flex; flex-direction: column; justify-content: space-between; }
  .back .brand { font-family: "Lobster", cursive; color: var(--blue); font-size: 18pt; line-height: 1; }
  .back .brand em { font-style: normal; font-family: "Cairo"; font-size: 8pt; color: var(--grey); margin-inline-start: 2mm; }
  .back .name { font-weight: 800; color: var(--deep); font-size: 13pt; line-height: 1.2; }
  .back .role { color: var(--grey); font-size: 8pt; }
  .back ul { list-style: none; display: grid; gap: 1mm; }
  .back li { display: flex; align-items: center; gap: 2mm; font-size: 8pt; color: #1f2937; }
  .back li svg { width: 3.4mm; height: 3.4mm; flex: none; }
  .back .qr { position: absolute; right: 21mm; top: 7mm; width: 15mm; height: 15mm; border: .3mm dashed var(--blue); border-radius: 1mm; display: flex; align-items: center; justify-content: center; font-size: 6pt; color: var(--blue); }
  .back .tag { direction: rtl; text-align: left; color: var(--blue); font-weight: 700; font-size: 8.5pt; }

  .label { font-size: 12px; color: var(--grey); }
  @media print {
    body { background: none; padding: 0; gap: 0; }
    .label { display: none; }
    .card { box-shadow: none; page-break-after: always; }
    @page { size: 96mm 61mm; margin: 0; }
  }
</style>
</head>
<body>

<div class="label">الوجه / Front</div>
<section class="card front" id="front">
  <svg class="rings" style="right:-17mm; top:-17mm; width:34mm; height:34mm; opacity:.8" viewBox="-50 -50 100 100" data-rings></svg>
  <img class="bottle" src="bottle.png" alt="Saver Ceramide Lotion">
  <div class="text">
    <div class="wordmark">Saver<small>CERAMIDE LOTION</small></div>
    <div class="divider"></div>
    <div class="slogan-ar">يسعد أيامك</div>
    <div class="slogan-en">Brightens Your Days</div>
  </div>
  <div class="band-bottom"></div>
</section>

<div class="label">الظهر / Back</div>
<section class="card back" id="back">
  <svg class="rings" style="right:2mm; bottom:-17mm; width:34mm; height:34mm; opacity:.8" viewBox="-50 -50 100 100" data-rings></svg>
  <div class="band"><span>CERAMIDE</span></div>
  <div class="info">
    <div class="brand">Saver<em>Skin Care</em></div>
    <div>
      <div class="name">الاسم هنا</div>
      <div class="role">المسمى الوظيفي · Job Title</div>
    </div>
    <ul>
      <li><svg viewBox="0 0 24 24" fill="#2F6EB5"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg><span dir="ltr">+20 1X XXXX XXXX</span></li>
      <li><svg viewBox="0 0 24 24" fill="#2F6EB5"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.2 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .1-3.2-.8-2.7-1.1-4.4-3.9-4.5-4.1-.1-.2-1.1-1.4-1.1-2.7s.7-1.9.9-2.2c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.4.6-.3.4c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.3 2.4 1.5.3.1.5.1.6-.1l.9-1.1c.2-.3.4-.2.7-.1l1.9.9c.3.1.5.2.5.3.1.2.1.7-.1 1.3z"/></svg><span dir="ltr">WhatsApp</span></li>
      <li><svg viewBox="0 0 24 24" fill="#2F6EB5"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm6.9 6h-2.9a15.6 15.6 0 0 0-1.4-3.6A8 8 0 0 1 18.9 8zM12 4c.8 1.2 1.5 2.5 1.9 4h-3.8c.4-1.5 1.1-2.8 1.9-4zM4.3 14a8 8 0 0 1 0-4h3.4a16.5 16.5 0 0 0 0 4zm.8 2h2.9c.3 1.3.8 2.5 1.4 3.6A8 8 0 0 1 5.1 16zM8 8H5.1a8 8 0 0 1 4.3-3.6C8.8 5.5 8.3 6.7 8 8zm4 12c-.8-1.2-1.5-2.5-1.9-4h3.8c-.4 1.5-1.1 2.8-1.9 4zm2.3-6H9.7a14.7 14.7 0 0 1 0-4h4.6a14.7 14.7 0 0 1 0 4zm.3 5.6c.6-1.1 1.1-2.3 1.4-3.6h2.9a8 8 0 0 1-4.3 3.6zM16.3 14a16.5 16.5 0 0 0 0-4h3.4a8 8 0 0 1 0 4z"/></svg><span dir="ltr">@saver.skincare</span></li>
    </ul>
    <div class="tag">يسعد أيامك</div>
  </div>
  <div class="qr">QR</div>
</section>

<script>
  // Draw the ceramide dot rings into every [data-rings] svg
  document.querySelectorAll('svg[data-rings]').forEach(svg => {
    const ns = 'http://www.w3.org/2000/svg';
    const core = document.createElementNS(ns, 'circle');
    core.setAttribute('r', 15); core.setAttribute('fill', '#E3ECF6');
    svg.appendChild(core);
    [[21, 28, 2.2], [29, 38, 2.0], [37, 48, 1.7], [45, 58, 1.4]].forEach(([r, n, d], i) => {
      for (let k = 0; k < n; k++) {
        const a = (k / n) * Math.PI * 2 + i * 0.12;
        const c = document.createElementNS(ns, 'circle');
        c.setAttribute('cx', (r * Math.cos(a)).toFixed(2));
        c.setAttribute('cy', (r * Math.sin(a)).toFixed(2));
        c.setAttribute('r', d);
        c.setAttribute('fill', i % 2 ? '#C9D9EC' : '#D9D9D9');
        svg.appendChild(c);
      }
    });
  });
</script>
</body>
</html>
